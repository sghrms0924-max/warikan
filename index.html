<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="割り勘">
<meta name="theme-color" content="#2c5f8a">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>生活費 負担割合</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=Syne:wght@600;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --bg:#f7f4ef;
  --paper:#fffdf9;
  --ink:#1a1612;
  --muted:#9a9080;
  --border:#e0d8cc;
  --his:#2c5f8a;
  --his-light:#ddeaf4;
  --her:#8a3f5f;
  --her-light:#f4dde7;
  --accent:#c97c2a;
  --success:#2a8a5f;
  --radius:14px;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}

html,body{height:100%;overscroll-behavior:none;}

body{
  font-family:'Noto Sans JP',sans-serif;
  background:var(--bg);
  color:var(--ink);
  display:flex;flex-direction:column;
  min-height:100vh;
}

/* ── NAV ── */
.nav{
  position:sticky;top:0;z-index:100;
  background:rgba(247,244,239,0.92);
  backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);
  padding: calc(0.8rem + var(--safe-top)) 1.2rem 0.8rem;
}
.nav-inner{
  max-width:680px;margin:0 auto;
  display:flex;align-items:center;justify-content:space-between;
}
.nav-title{
  font-family:'Syne',sans-serif;
  font-size:1.05rem;font-weight:800;
  color:var(--ink);
}
.nav-title span{color:var(--his);}

.tab-bar{
  display:flex;gap:0.3rem;
  background:var(--bg);border:1px solid var(--border);
  border-radius:999px;padding:3px;
}
.tab-btn{
  border:none;background:none;
  border-radius:999px;
  font-family:'Noto Sans JP',sans-serif;
  font-size:0.72rem;font-weight:500;
  padding:0.3rem 0.8rem;
  cursor:pointer;color:var(--muted);
  transition:all 0.2s;
  white-space:nowrap;
}
.tab-btn.active{
  background:var(--his);color:#fff;
}

/* ── CONTENT ── */
.content{
  flex:1;overflow-y:auto;
  padding:1.2rem 1rem calc(1.5rem + var(--safe-bottom));
}
.page{display:none;}
.page.active{display:block;}
.inner{max-width:680px;margin:0 auto;}

/* ── CARDS ── */
.card{
  background:var(--paper);
  border:1.5px solid var(--border);
  border-radius:var(--radius);
  margin-bottom:1rem;
  overflow:hidden;
}
.card-header{
  padding:0.8rem 1.1rem;
  border-bottom:1px solid var(--border);
  font-family:'DM Mono',monospace;
  font-size:0.65rem;letter-spacing:0.12em;text-transform:uppercase;
  color:var(--muted);
  display:flex;justify-content:space-between;align-items:center;
}

/* ── INCOME ── */
.income-grid{
  display:grid;grid-template-columns:1fr 1fr;
  gap:1rem;padding:1rem;
}
.person-block{position:relative;}
.person-label{
  font-family:'Syne',sans-serif;
  font-size:0.72rem;font-weight:600;
  letter-spacing:0.04em;margin-bottom:0.6rem;
}
.his .person-label{color:var(--his);}
.her .person-label{color:var(--her);}

.name-input{
  width:100%;background:none;border:none;
  border-bottom:1.5px solid var(--border);
  outline:none;
  font-family:'Noto Sans JP',sans-serif;
  font-size:0.88rem;color:var(--ink);
  padding:0.15rem 0;margin-bottom:0.7rem;
}
.his .name-input:focus{border-color:var(--his);}
.her .name-input:focus{border-color:var(--her);}

.amt-row{
  display:flex;align-items:center;
  background:var(--bg);border:1px solid var(--border);
  border-radius:8px;overflow:hidden;margin-bottom:0.5rem;
}
.amt-row input{
  flex:1;background:none;border:none;outline:none;
  font-family:'DM Mono',monospace;
  font-size:1rem;color:var(--ink);
  padding:0.5rem 0.6rem;min-width:0;
}
.amt-row .unit{padding:0 0.6rem;color:var(--muted);font-size:0.72rem;white-space:nowrap;}

.period-sw{display:flex;gap:0.3rem;}
.period-sw button{
  flex:1;border:1px solid var(--border);background:none;
  border-radius:6px;font-family:'Noto Sans JP',sans-serif;
  font-size:0.7rem;padding:0.28rem;cursor:pointer;
  color:var(--muted);transition:all 0.15s;
}
.his .period-sw button.active{background:var(--his);color:#fff;border-color:var(--his);}
.her .period-sw button.active{background:var(--her);color:#fff;border-color:var(--her);}

/* ratio bar */
.ratio-row{
  padding:0.8rem 1.1rem;
  border-top:1px solid var(--border);
}
.ratio-labels{
  display:flex;justify-content:space-between;
  font-family:'DM Mono',monospace;
  font-size:0.72rem;margin-bottom:0.4rem;
}
.ratio-labels .h{color:var(--his);}
.ratio-labels .r{color:var(--her);}
.ratio-bar{height:10px;border-radius:999px;overflow:hidden;display:flex;background:var(--border);}
.ratio-bar .hs{background:var(--his);height:100%;transition:width 0.4s cubic-bezier(0.4,0,0.2,1);}
.ratio-bar .rs{background:var(--her);height:100%;flex:1;}

/* ── EXPENSES ── */
.exp-list{padding:0.5rem 0.8rem;}
.exp-item{
  display:flex;
  flex-direction:column;
  gap:0.35rem;
  padding:0.65rem 0;
  border-bottom:1px solid var(--border);
}
.exp-item:last-child{border-bottom:none;}

.exp-row-top{
  display:grid;
  grid-template-columns:1fr auto auto auto;
  align-items:center;gap:0.5rem;
}

.exp-row-bottom{
  display:flex;
  align-items:center;
  gap:0.4rem;
  padding-left:0.1rem;
}

.exp-name{
  background:none;border:none;outline:none;
  font-family:'Noto Sans JP',sans-serif;
  font-size:0.83rem;color:var(--ink);width:100%;
  border-bottom:1px dashed transparent;
  transition:border-color 0.2s;padding:0.1rem 0;
}
.exp-name:focus{border-color:var(--accent);}

.exp-amt-w{
  display:flex;align-items:center;
  background:var(--bg);border:1px solid var(--border);
  border-radius:6px;overflow:hidden;
}
.exp-amt-w input{
  background:none;border:none;outline:none;
  font-family:'DM Mono',monospace;
  font-size:0.82rem;color:var(--ink);
  padding:0.35rem 0.4rem;width:72px;text-align:right;
}
.exp-amt-w span{padding-right:0.4rem;color:var(--muted);font-size:0.68rem;white-space:nowrap;}

.split-tog{
  display:flex;border:1px solid var(--border);
  border-radius:6px;overflow:hidden;
}
.split-tog button{
  border:none;background:none;
  font-size:0.65rem;padding:0.3rem 0.4rem;
  cursor:pointer;color:var(--muted);
  transition:all 0.15s;white-space:nowrap;
}
.split-tog button.r{background:var(--accent);color:#fff;}
.split-tog button.h{background:var(--success);color:#fff;}

.del-btn{
  background:none;border:none;color:var(--border);
  cursor:pointer;font-size:0.85rem;padding:0 0.2rem;
  transition:color 0.15s;line-height:1;
}
.del-btn:hover{color:#c0392b;}

/* payment source toggle */
.pay-src-tog{
  display:flex;border:1px solid var(--border);
  border-radius:6px;overflow:hidden;
}
.pay-src-tog button{
  border:none;background:none;
  font-size:0.6rem;padding:0.22rem 0.45rem;
  cursor:pointer;color:var(--muted);
  transition:all 0.15s;white-space:nowrap;
}
.pay-src-tog button.common-active{background:var(--muted);color:#fff;}
.pay-src-tog button.his-active{background:var(--his);color:#fff;}
.pay-src-tog button.her-active{background:var(--her);color:#fff;}

.pay-src-label{
  font-size:0.6rem;
  color:var(--muted);
  white-space:nowrap;
}

.add-exp-btn{
  width:100%;background:none;
  border:1.5px dashed var(--border);
  border-radius:10px;
  color:var(--muted);
  font-family:'Noto Sans JP',sans-serif;
  font-size:0.8rem;padding:0.65rem;
  cursor:pointer;transition:all 0.2s;margin:0.5rem 0;
}
.add-exp-btn:hover{border-color:var(--accent);color:var(--accent);}

/* ── OPTIONS ROW ── */
.options-row{
  padding:0.6rem 1.1rem;
  border-top:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
}
.options-label{
  font-size:0.72rem;
  color:var(--muted);
}
.round-tog{
  display:flex;border:1px solid var(--border);
  border-radius:6px;overflow:hidden;
}
.round-tog button{
  border:none;background:none;
  font-size:0.65rem;padding:0.3rem 0.6rem;
  cursor:pointer;color:var(--muted);
  transition:all 0.15s;white-space:nowrap;
}
.round-tog button.active{background:var(--accent);color:#fff;}

/* result summary */
.result-grid{display:grid;grid-template-columns:1fr 1fr;}
.result-person{padding:1rem 1.1rem;}
.result-person:first-child{border-right:1px solid var(--border);}
.res-name{font-family:'Syne',sans-serif;font-size:0.82rem;font-weight:600;margin-bottom:0.2rem;}
.his .res-name{color:var(--his);}
.her .res-name{color:var(--her);}
.res-amt{font-family:'DM Mono',monospace;font-size:1.5rem;font-weight:500;color:var(--ink);margin-bottom:0.1rem;}
.res-sub{font-family:'DM Mono',monospace;font-size:0.7rem;color:var(--muted);}
.res-advance{
  font-family:'DM Mono',monospace;
  font-size:0.68rem;
  color:var(--accent);
  margin-top:0.15rem;
}

.total-row{
  padding:0.8rem 1.1rem;
  border-top:1px solid var(--border);
  display:flex;justify-content:space-between;align-items:center;
}
.total-label{font-size:0.8rem;color:var(--muted);}
.total-val{font-family:'DM Mono',monospace;font-size:1rem;font-weight:500;}

/* settlement row */
.settle-row{
  padding:0.8rem 1.1rem;
  border-top:1.5px solid var(--accent);
  background:rgba(201,124,42,0.06);
  display:flex;justify-content:space-between;align-items:center;
}
.settle-label{font-size:0.78rem;color:var(--accent);font-weight:500;}
.settle-val{font-family:'DM Mono',monospace;font-size:0.95rem;font-weight:500;color:var(--accent);}

/* save btn */
.save-btn{
  width:100%;
  background:var(--his);color:#fff;
  border:none;border-radius:var(--radius);
  font-family:'Noto Sans JP',sans-serif;
  font-size:0.9rem;font-weight:500;
  padding:0.9rem;cursor:pointer;
  transition:all 0.2s;margin-bottom:1rem;
}
.save-btn:active{transform:scale(0.98);opacity:0.9;}

/* toast */
.toast{
  position:fixed;bottom:calc(1.5rem + var(--safe-bottom));
  left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--ink);color:#fff;
  font-size:0.8rem;padding:0.6rem 1.2rem;
  border-radius:999px;
  opacity:0;transition:all 0.3s;pointer-events:none;
  white-space:nowrap;z-index:200;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* ── HISTORY PAGE ── */
.history-empty{
  text-align:center;padding:3rem 1rem;
  color:var(--muted);font-size:0.85rem;line-height:2;
}

.month-card{
  background:var(--paper);
  border:1.5px solid var(--border);
  border-radius:var(--radius);
  margin-bottom:0.8rem;
  overflow:hidden;
}
.month-head{
  padding:0.75rem 1rem;
  display:flex;justify-content:space-between;align-items:center;
  cursor:pointer;
  border-bottom:1px solid transparent;
  transition:border-color 0.2s;
}
.month-head.open{border-bottom-color:var(--border);}
.month-label{
  font-family:'DM Mono',monospace;
  font-size:0.78rem;color:var(--his);
}
.month-total{
  font-family:'DM Mono',monospace;
  font-size:0.85rem;color:var(--ink);
}
.month-detail{display:none;padding:0.7rem 1rem;}
.month-detail.open{display:block;}
.month-detail-row{
  display:flex;justify-content:space-between;
  font-size:0.78rem;padding:0.2rem 0;
  border-bottom:1px solid var(--border);
}
.month-detail-row:last-child{border:none;}
.month-settle{
  font-size:0.78rem;padding:0.4rem 0 0.2rem;
  color:var(--accent);font-weight:500;
  text-align:center;
}
.month-del{
  background:none;border:none;color:var(--muted);
  font-size:0.7rem;cursor:pointer;
  padding:0 0.3rem;transition:color 0.15s;
}
.month-del:hover{color:#c0392b;}

/* ── CHART PAGE ── */
.chart-wrap{
  background:var(--paper);
  border:1.5px solid var(--border);
  border-radius:var(--radius);
  padding:1rem;
  margin-bottom:1rem;
}
.chart-title{
  font-family:'DM Mono',monospace;
  font-size:0.68rem;letter-spacing:0.1em;text-transform:uppercase;
  color:var(--muted);margin-bottom:0.8rem;
}
canvas{max-height:240px;}

@media(max-width:420px){
  .income-grid{grid-template-columns:1fr;}
  .exp-row-top{grid-template-columns:1fr auto auto;}
  .del-btn{display:none;}
}
</style>
</head>
<body>

<nav class="nav">
  <div class="nav-inner">
    <div class="nav-title">割り勘<span>計算</span></div>
    <div class="tab-bar">
      <button class="tab-btn active" onclick="showPage('calc')">計算</button>
      <button class="tab-btn" onclick="showPage('history')">履歴</button>
      <button class="tab-btn" onclick="showPage('chart')">グラフ</button>
    </div>
  </div>
</nav>

<div class="content">

<!-- ===== CALC PAGE ===== -->
<div class="page active" id="page-calc">
<div class="inner">

  <!-- Income -->
  <div class="card">
    <div class="card-header">収入入力</div>
    <div class="income-grid">
      <div class="person-block his">
        <div class="person-label">👨 あなた</div>
        <input class="name-input" id="hisName" type="text" value="自分" placeholder="名前" oninput="calc()">
        <div class="amt-row">
          <input type="number" id="hisIncome" placeholder="0" min="0" oninput="calc()">
          <span class="unit">万円</span>
        </div>
        <div class="period-sw">
          <button id="hisYear" class="active" onclick="setPeriod('his','year')">年収</button>
          <button id="hisMonth" onclick="setPeriod('his','month')">月収</button>
        </div>
      </div>
      <div class="person-block her">
        <div class="person-label">👩 パートナー</div>
        <input class="name-input" id="herName" type="text" value="妻" placeholder="名前" oninput="calc()">
        <div class="amt-row">
          <input type="number" id="herIncome" placeholder="0" min="0" oninput="calc()">
          <span class="unit">万円</span>
        </div>
        <div class="period-sw">
          <button id="herYear" class="active" onclick="setPeriod('her','year')">年収</button>
          <button id="herMonth" onclick="setPeriod('her','month')">月収</button>
        </div>
      </div>
    </div>
    <div class="ratio-row">
      <div class="ratio-labels">
        <span class="h" id="hisBarPct">—%</span>
        <span style="color:var(--muted);font-size:0.65rem;">収入比</span>
        <span class="r" id="herBarPct">—%</span>
      </div>
      <div class="ratio-bar">
        <div class="hs" id="hisBarSeg" style="width:50%"></div>
        <div class="rs"></div>
      </div>
    </div>
  </div>

  <!-- Expenses -->
  <div class="card">
    <div class="card-header">
      <span>費目リスト</span>
      <span style="font-size:0.6rem;color:var(--accent)">年収比 / 折半</span>
    </div>
    <div class="exp-list" id="expList"></div>
    <div style="padding:0 0.8rem 0.8rem">
      <button class="add-exp-btn" onclick="addExp()">＋ 費目を追加</button>
    </div>
    <div class="options-row">
      <span class="options-label">端数処理</span>
      <div class="round-tog">
        <button id="roundOff" onclick="setRounding('off')">そのまま</button>
        <button id="roundOn" class="active" onclick="setRounding('on')">100円単位</button>
      </div>
    </div>
  </div>

  <!-- Result -->
  <div class="card">
    <div class="card-header">月額 負担まとめ</div>
    <div class="result-grid">
      <div class="result-person his">
        <div class="res-name" id="resHisName">自分</div>
        <div class="res-amt" id="resHisAmt">0万</div>
        <div class="res-sub" id="resHisSub">—</div>
        <div class="res-advance" id="resHisAdv"></div>
      </div>
      <div class="result-person her">
        <div class="res-name" id="resHerName">妻</div>
        <div class="res-amt" id="resHerAmt">0万</div>
        <div class="res-sub" id="resHerSub">—</div>
        <div class="res-advance" id="resHerAdv"></div>
      </div>
    </div>
    <div class="total-row">
      <span class="total-label">合計生活費</span>
      <span class="total-val" id="resTotalAmt">0 万円/月</span>
    </div>
    <div class="settle-row" id="settleRow" style="display:none;">
      <span class="settle-label" id="settleLabel">精算不要</span>
      <span class="settle-val" id="settleVal"></span>
    </div>
  </div>

  <button class="save-btn" onclick="saveRecord()">📅 今月の記録を保存</button>

</div>
</div>

<!-- ===== HISTORY PAGE ===== -->
<div class="page" id="page-history">
<div class="inner">
  <div id="historyList"></div>
</div>
</div>

<!-- ===== CHART PAGE ===== -->
<div class="page" id="page-chart">
<div class="inner">
  <div class="chart-wrap">
    <div class="chart-title">月別 合計生活費</div>
    <canvas id="chartTotal"></canvas>
  </div>
  <div class="chart-wrap">
    <div class="chart-title">月別 負担割合</div>
    <canvas id="chartRatio"></canvas>
  </div>
  <div class="chart-wrap">
    <div class="chart-title">今月の費目内訳</div>
    <canvas id="chartDoughnut"></canvas>
  </div>
</div>
</div>

</div><!-- /content -->

<div class="toast" id="toast"></div>

<script>
// ─── STATE ───────────────────────────────────────────────
let periods = { his:'year', her:'year' };
let rounding = 'on'; // 'on' = 100円単位丸め, 'off' = そのまま
const DEFAULT_EXPS = [
  {name:'家賃・住居費', amount:0, split:'ratio', paidBy:'common'},
  {name:'食費・日用品', amount:0, split:'ratio', paidBy:'common'},
  {name:'水道光熱費',   amount:0, split:'ratio', paidBy:'common'},
  {name:'通信費',       amount:0, split:'half',  paidBy:'common'},
  {name:'交際費・外食', amount:0, split:'ratio', paidBy:'common'},
];
let exps = [];
let records = [];
let charts = {};

// ─── STORAGE ─────────────────────────────────────────────
function save() {
  localStorage.setItem('warikin_state', JSON.stringify({
    hisName: v('hisName'), herName: v('herName'),
    hisIncome: v('hisIncome'), herIncome: v('herIncome'),
    hisPeriod: periods.his, herPeriod: periods.her,
    rounding,
    exps
  }));
  localStorage.setItem('warikin_records', JSON.stringify(records));
}

function load() {
  const s = JSON.parse(localStorage.getItem('warikin_state') || 'null');
  records = JSON.parse(localStorage.getItem('warikin_records') || '[]');
  if (s) {
    document.getElementById('hisName').value = s.hisName || '自分';
    document.getElementById('herName').value = s.herName || '妻';
    document.getElementById('hisIncome').value = s.hisIncome || '';
    document.getElementById('herIncome').value = s.herIncome || '';
    periods.his = s.hisPeriod || 'year';
    periods.her = s.herPeriod || 'year';
    rounding = s.rounding || 'on';
    ['his','her'].forEach(p => {
      document.getElementById(p+'Year').classList.toggle('active', periods[p]==='year');
      document.getElementById(p+'Month').classList.toggle('active', periods[p]==='month');
    });
    document.getElementById('roundOn').classList.toggle('active', rounding==='on');
    document.getElementById('roundOff').classList.toggle('active', rounding==='off');
    exps = s.exps || JSON.parse(JSON.stringify(DEFAULT_EXPS));
    // migrate old data without paidBy
    exps.forEach(e => { if(!e.paidBy) e.paidBy = 'common'; });
  } else {
    exps = JSON.parse(JSON.stringify(DEFAULT_EXPS));
  }
}

// ─── HELPERS ─────────────────────────────────────────────
function v(id){ return document.getElementById(id).value; }
function getMonthly(p){
  const val = parseFloat(document.getElementById(p+'Income').value) || 0;
  return periods[p]==='year' ? val/12 : val;
}
function getNames(){ return { his: v('hisName')||'自分', her: v('herName')||'パートナー' }; }

function getRatios(){
  const hm = getMonthly('his'), herm = getMonthly('her');
  const total = hm + herm;
  return total > 0 ? { hisR: hm/total, herR: herm/total, total } : { hisR:0.5, herR:0.5, total:0 };
}

function applyRounding(val){
  // 万円 → 100円単位に丸める = 小数点以下3桁目で丸め (0.01万 = 100円)
  if(rounding === 'on'){
    return Math.round(val * 100) / 100;
  }
  return val;
}

// ─── ROUNDING TOGGLE ──────────────────────────────────────
function setRounding(mode){
  rounding = mode;
  document.getElementById('roundOn').classList.toggle('active', mode==='on');
  document.getElementById('roundOff').classList.toggle('active', mode==='off');
  calc(); save();
}

// ─── PERIOD TOGGLE ────────────────────────────────────────
function setPeriod(p, mode){
  periods[p] = mode;
  document.getElementById(p+'Year').classList.toggle('active', mode==='year');
  document.getElementById(p+'Month').classList.toggle('active', mode==='month');
  calc(); save();
}

// ─── CALC ─────────────────────────────────────────────────
function calc(){
  const {hisR, herR, total} = getRatios();
  const hisPct = Math.round(hisR*100);
  const herPct = 100 - hisPct;
  const hasIncome = total > 0;

  document.getElementById('hisBarPct').textContent = hasIncome ? hisPct+'%' : '—%';
  document.getElementById('herBarPct').textContent = hasIncome ? herPct+'%' : '—%';
  document.getElementById('hisBarSeg').style.width = (hasIncome ? hisPct : 50) + '%';

  renderExps(hisR, herR);

  let hisTot=0, herTot=0, grand=0;
  let hisAdvanced=0, herAdvanced=0; // 立替額

  exps.forEach(e => {
    const a = parseFloat(e.amount)||0;
    grand += a;

    // 負担額の計算
    let hisBurden, herBurden;
    if(e.split==='half'){
      hisBurden = a/2;
      herBurden = a/2;
    } else {
      hisBurden = a*hisR;
      herBurden = a*herR;
    }

    hisTot += hisBurden;
    herTot += herBurden;

    // 立替の追跡
    if(e.paidBy === 'his'){
      // 自分が全額立替 → 相手の負担分を自分が立て替えた
      hisAdvanced += herBurden;
    } else if(e.paidBy === 'her'){
      // 相手が全額立替 → 自分の負担分を相手が立て替えた
      herAdvanced += hisBurden;
    }
  });

  // 端数処理
  hisTot = applyRounding(hisTot);
  herTot = applyRounding(herTot);
  hisAdvanced = applyRounding(hisAdvanced);
  herAdvanced = applyRounding(herAdvanced);

  const n = getNames();
  document.getElementById('resHisName').textContent = n.his;
  document.getElementById('resHerName').textContent = n.her;
  document.getElementById('resHisAmt').textContent = hisTot.toFixed(2)+'万';
  document.getElementById('resHerAmt').textContent = herTot.toFixed(2)+'万';
  document.getElementById('resHisSub').textContent = grand>0 ? `実質 ${(hisTot/grand*100).toFixed(1)}%` : '—';
  document.getElementById('resHerSub').textContent = grand>0 ? `実質 ${(herTot/grand*100).toFixed(1)}%` : '—';
  document.getElementById('resTotalAmt').textContent = grand.toFixed(2)+' 万円/月';

  // 立替表示
  document.getElementById('resHisAdv').textContent = hisAdvanced > 0 ? `立替: ${hisAdvanced.toFixed(2)}万` : '';
  document.getElementById('resHerAdv').textContent = herAdvanced > 0 ? `立替: ${herAdvanced.toFixed(2)}万` : '';

  // 精算表示
  const settleRow = document.getElementById('settleRow');
  const netSettle = hisAdvanced - herAdvanced; // 正なら相手→自分へ支払い
  if(netSettle > 0.001){
    settleRow.style.display = 'flex';
    document.getElementById('settleLabel').textContent = `${n.her} → ${n.his}`;
    document.getElementById('settleVal').textContent = `${applyRounding(Math.abs(netSettle)).toFixed(2)} 万円`;
  } else if(netSettle < -0.001){
    settleRow.style.display = 'flex';
    document.getElementById('settleLabel').textContent = `${n.his} → ${n.her}`;
    document.getElementById('settleVal').textContent = `${applyRounding(Math.abs(netSettle)).toFixed(2)} 万円`;
  } else {
    settleRow.style.display = 'none';
  }
}

// ─── RENDER EXPS ─────────────────────────────────────────
function renderExps(hisR, herR){
  const list = document.getElementById('expList');
  const n = getNames();
  list.innerHTML = '';
  exps.forEach((e,i) => {
    const a = parseFloat(e.amount)||0;
    const paidBy = e.paidBy || 'common';
    const row = document.createElement('div');
    row.className = 'exp-item';
    row.innerHTML = `
      <div class="exp-row-top">
        <input class="exp-name" type="text" value="${e.name}" placeholder="費目名"
          oninput="exps[${i}].name=this.value;save()">
        <div class="exp-amt-w">
          <input type="number" min="0" step="0.1" value="${e.amount||''}" placeholder="0"
            oninput="exps[${i}].amount=parseFloat(this.value)||0;calc();save()">
          <span>万/月</span>
        </div>
        <div class="split-tog">
          <button class="${e.split==='ratio'?'r':''}" onclick="setSplit(${i},'ratio')">比</button>
          <button class="${e.split==='half'?'h':''}" onclick="setSplit(${i},'half')">半</button>
        </div>
        <button class="del-btn" onclick="delExp(${i})">✕</button>
      </div>
      <div class="exp-row-bottom">
        <span class="pay-src-label">支払元:</span>
        <div class="pay-src-tog">
          <button class="${paidBy==='common'?'common-active':''}" onclick="setPaidBy(${i},'common')">共通</button>
          <button class="${paidBy==='his'?'his-active':''}" onclick="setPaidBy(${i},'his')">${n.his}</button>
          <button class="${paidBy==='her'?'her-active':''}" onclick="setPaidBy(${i},'her')">${n.her}</button>
        </div>
      </div>
    `;
    list.appendChild(row);
  });
}

function setSplit(i, mode){ exps[i].split=mode; calc(); save(); }
function setPaidBy(i, who){ exps[i].paidBy=who; calc(); save(); }
function addExp(){
  exps.push({name:'新しい費目',amount:0,split:'ratio',paidBy:'common'});
  calc(); save();
  setTimeout(()=>{
    const inputs=document.querySelectorAll('.exp-name');
    if(inputs.length) inputs[inputs.length-1].focus();
  },50);
}
function delExp(i){ exps.splice(i,1); calc(); save(); }

// ─── SAVE RECORD ─────────────────────────────────────────
function saveRecord(){
  const {hisR, herR} = getRatios();
  let hisTot=0, herTot=0, grand=0;
  let hisAdvanced=0, herAdvanced=0;

  exps.forEach(e=>{
    const a=parseFloat(e.amount)||0;
    grand+=a;
    let hisBurden, herBurden;
    if(e.split==='half'){hisBurden=a/2;herBurden=a/2;}
    else{hisBurden=a*hisR;herBurden=a*herR;}
    hisTot+=hisBurden;
    herTot+=herBurden;
    if(e.paidBy==='his') hisAdvanced+=herBurden;
    if(e.paidBy==='her') herAdvanced+=hisBurden;
  });
  if(grand===0){ toast('費目の金額を入力してください'); return; }

  hisTot = applyRounding(hisTot);
  herTot = applyRounding(herTot);
  hisAdvanced = applyRounding(hisAdvanced);
  herAdvanced = applyRounding(herAdvanced);

  const now = new Date();
  const label = `${now.getFullYear()}年${now.getMonth()+1}月`;
  const n = getNames();
  const netSettle = hisAdvanced - herAdvanced;
  const rec = {
    label, date: now.toISOString(),
    hisName: n.his, herName: n.her,
    hisAmt: parseFloat(hisTot.toFixed(2)),
    herAmt: parseFloat(herTot.toFixed(2)),
    total: parseFloat(grand.toFixed(2)),
    hisR: parseFloat(hisR.toFixed(4)),
    hisAdvanced: parseFloat(hisAdvanced.toFixed(2)),
    herAdvanced: parseFloat(herAdvanced.toFixed(2)),
    netSettle: parseFloat(applyRounding(Math.abs(netSettle)).toFixed(2)),
    settleDir: netSettle > 0.001 ? 'her2his' : (netSettle < -0.001 ? 'his2her' : 'none'),
    exps: exps.map(e=>({...e}))
  };
  records.unshift(rec);
  save();
  toast(`${label}を保存しました ✓`);
  renderHistory();
}

// ─── TOAST ───────────────────────────────────────────────
function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'),2200);
}

// ─── HISTORY ─────────────────────────────────────────────
function renderHistory(){
  const el = document.getElementById('historyList');
  if(!records.length){
    el.innerHTML = `<div class="history-empty">まだ記録がありません<br>計算ページで「今月の記録を保存」を押してください</div>`;
    return;
  }
  el.innerHTML = '';
  records.forEach((r,i)=>{
    const mc = document.createElement('div');
    mc.className = 'month-card';
    const hisPct = Math.round(r.hisR*100);

    let settleHtml = '';
    if(r.settleDir === 'her2his'){
      settleHtml = `<div class="month-settle">精算: ${r.herName} → ${r.hisName} ${r.netSettle}万円</div>`;
    } else if(r.settleDir === 'his2her'){
      settleHtml = `<div class="month-settle">精算: ${r.hisName} → ${r.herName} ${r.netSettle}万円</div>`;
    }

    mc.innerHTML = `
      <div class="month-head" onclick="toggleDetail(this)">
        <span class="month-label">${r.label}</span>
        <span style="display:flex;align-items:center;gap:0.7rem">
          <span style="font-size:0.7rem;color:var(--muted)">${r.hisName} ${hisPct}% / ${r.herName} ${100-hisPct}%</span>
          <span class="month-total">${r.total}万円</span>
          <button class="month-del" onclick="event.stopPropagation();delRecord(${i})">削除</button>
        </span>
      </div>
      <div class="month-detail">
        <div class="month-detail-row"><span>${r.hisName}の負担</span><span style="color:var(--his);font-family:'DM Mono',monospace">${r.hisAmt}万円</span></div>
        <div class="month-detail-row"><span>${r.herName}の負担</span><span style="color:var(--her);font-family:'DM Mono',monospace">${r.herAmt}万円</span></div>
        ${r.exps.map(e=>{
          const paidLabel = e.paidBy==='his' ? ` [${r.hisName}立替]` : (e.paidBy==='her' ? ` [${r.herName}立替]` : '');
          return `
          <div class="month-detail-row">
            <span>${e.name}${paidLabel}</span>
            <span style="font-family:'DM Mono',monospace;color:var(--muted)">${e.amount||0}万 (${e.split==='half'?'折半':'年収比'})</span>
          </div>`;
        }).join('')}
        ${settleHtml}
      </div>
    `;
    el.appendChild(mc);
  });
}

function toggleDetail(head){
  head.classList.toggle('open');
  head.nextElementSibling.classList.toggle('open');
}

function delRecord(i){
  if(!confirm('この記録を削除しますか？')) return;
  records.splice(i,1);
  save();
  renderHistory();
  renderCharts();
}

// ─── CHARTS ──────────────────────────────────────────────
function renderCharts(){
  Object.values(charts).forEach(c=>c.destroy());
  charts = {};

  if(!records.length){
    ['chartTotal','chartRatio','chartDoughnut'].forEach(id=>{
      const ctx = document.getElementById(id).getContext('2d');
      ctx.clearRect(0,0,9999,9999);
    });
    return;
  }

  const rev = [...records].reverse();
  const labels = rev.map(r=>r.label.replace('年','年\n'));
  const totals = rev.map(r=>r.total);
  const hisAmts = rev.map(r=>r.hisAmt);
  const herAmts = rev.map(r=>r.herAmt);

  charts.total = new Chart(document.getElementById('chartTotal').getContext('2d'),{
    type:'bar',
    data:{
      labels,
      datasets:[{
        label:'合計生活費（万円）',
        data:totals,
        backgroundColor:'rgba(44,95,138,0.25)',
        borderColor:'#2c5f8a',
        borderWidth:2,
        borderRadius:6,
      }]
    },
    options:{
      responsive:true,maintainAspectRatio:true,
      plugins:{legend:{display:false}},
      scales:{y:{beginAtZero:true,ticks:{font:{size:10}}},x:{ticks:{font:{size:10}}}}
    }
  });

  const hisName = records[0]?.hisName||'自分';
  const herName = records[0]?.herName||'パートナー';
  charts.ratio = new Chart(document.getElementById('chartRatio').getContext('2d'),{
    type:'bar',
    data:{
      labels,
      datasets:[
        {label:hisName, data:hisAmts, backgroundColor:'rgba(44,95,138,0.75)', borderRadius:4},
        {label:herName, data:herAmts, backgroundColor:'rgba(138,63,95,0.75)', borderRadius:4},
      ]
    },
    options:{
      responsive:true,maintainAspectRatio:true,
      plugins:{legend:{labels:{font:{size:11}}}},
      scales:{
        y:{beginAtZero:true,stacked:true,ticks:{font:{size:10}}},
        x:{stacked:true,ticks:{font:{size:10}}}
      }
    }
  });

  const latest = records[0];
  const dLabels = latest.exps.filter(e=>parseFloat(e.amount)>0).map(e=>e.name);
  const dData = latest.exps.filter(e=>parseFloat(e.amount)>0).map(e=>parseFloat(e.amount));
  const dColors = ['#2c5f8a','#8a3f5f','#c97c2a','#2a8a5f','#5f8a2c','#6a3f8a','#8a6a2c'];

  charts.doughnut = new Chart(document.getElementById('chartDoughnut').getContext('2d'),{
    type:'doughnut',
    data:{
      labels:dLabels,
      datasets:[{data:dData, backgroundColor:dColors.slice(0,dLabels.length), borderWidth:2, borderColor:'#fffdf9'}]
    },
    options:{
      responsive:true,maintainAspectRatio:true,
      plugins:{legend:{position:'bottom',labels:{font:{size:10},padding:12}}}
    }
  });
}

// ─── PAGE SWITCH ─────────────────────────────────────────
function showPage(name){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('page-'+name).classList.add('active');
  event.currentTarget.classList.add('active');
  if(name==='history') renderHistory();
  if(name==='chart') renderCharts();
}

if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('./sw.js').catch(()=>{});
  });
}

// ─── INIT ─────────────────────────────────────────────────
load();
calc();
</script>
