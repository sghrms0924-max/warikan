<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="割り勘">
<meta name="theme-color" content="#2c5f8a">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>生活費 負担割合</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=Syne:wght@600;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --bg:#f7f4ef;
  --paper:#fffdf9;
  --ink:#1a1612;
  --muted:#9a9080;
  --border:#e0d8cc;
  --his:#2c5f8a;
  --his-light:#ddeaf4;
  --her:#8a3f5f;
  --her-light:#f4dde7;
  --accent:#c97c2a;
  --success:#2a8a5f;
  --aid:#6a3f8a;
  --radius:14px;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}

html,body{height:100%;overscroll-behavior:none;}

body{
  font-family:'Noto Sans JP',sans-serif;
  background:var(--bg);
  color:var(--ink);
  display:flex;flex-direction:column;
  min-height:100vh;
}

/* ── NAV ── */
.nav{
  position:sticky;top:0;z-index:100;
  background:rgba(247,244,239,0.92);
  backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);
  padding: calc(0.8rem + var(--safe-top)) 1.2rem 0.8rem;
}
.nav-inner{
  max-width:680px;margin:0 auto;
  display:flex;align-items:center;justify-content:space-between;
}
.nav-title{
  font-family:'Syne',sans-serif;
  font-size:1.05rem;font-weight:800;
  color:var(--ink);
}
.nav-title span{color:var(--his);}

.tab-bar{
  display:flex;gap:0.3rem;
  background:var(--bg);border:1px solid var(--border);
  border-radius:999px;padding:3px;
}
.tab-btn{
  border:none;background:none;
  border-radius:999px;
  font-family:'Noto Sans JP',sans-serif;
  font-size:0.72rem;font-weight:500;
  padding:0.3rem 0.8rem;
  cursor:pointer;color:var(--muted);
  transition:all 0.2s;
  white-space:nowrap;
}
.tab-btn.active{
  background:var(--his);color:#fff;
}

/* ── CONTENT ── */
.content{
  flex:1;overflow-y:auto;
  padding:1.2rem 1rem calc(1.5rem + var(--safe-bottom));
}
.page{display:none;}
.page.active{display:block;}
.inner{max-width:680px;margin:0 auto;}

/* ── CARDS ── */
.card{
  background:var(--paper);
  border:1.5px solid var(--border);
  border-radius:var(--radius);
  margin-bottom:1rem;
  overflow:hidden;
}
.card-header{
  padding:0.8rem 1.1rem;
  border-bottom:1px solid var(--border);
  font-family:'DM Mono',monospace;
  font-size:0.65rem;letter-spacing:0.12em;text-transform:uppercase;
  color:var(--muted);
  display:flex;justify-content:space-between;align-items:center;
}

/* ── INCOME ── */
.income-grid{
  display:grid;grid-template-columns:1fr 1fr;
  gap:1rem;padding:1rem;
}
.person-block{position:relative;}
.person-label{
  font-family:'Syne',sans-serif;
  font-size:0.72rem;font-weight:600;
  letter-spacing:0.04em;margin-bottom:0.6rem;
}
.his .person-label{color:var(--his);}
.her .person-label{color:var(--her);}

.name-input{
  width:100%;background:none;border:none;
  border-bottom:1.5px solid var(--border);
  outline:none;
  font-family:'Noto Sans JP',sans-serif;
  font-size:0.88rem;color:var(--ink);
  padding:0.15rem 0;margin-bottom:0.7rem;
}
.his .name-input:focus{border-color:var(--his);}
.her .name-input:focus{border-color:var(--her);}

.amt-row{
  display:flex;align-items:center;
  background:var(--bg);border:1px solid var(--border);
  border-radius:8px;overflow:hidden;margin-bottom:0.5rem;
}
.amt-row input{
  flex:1;background:none;border:none;outline:none;
  font-family:'DM Mono',monospace;
  font-size:1rem;color:var(--ink);
  padding:0.5rem 0.6rem;min-width:0;
}
.amt-row .unit{padding:0 0.6rem;color:var(--muted);font-size:0.72rem;white-space:nowrap;}

.period-sw{display:flex;gap:0.3rem;}
.period-sw button{
  flex:1;border:1px solid var(--border);background:none;
  border-radius:6px;font-family:'Noto Sans JP',sans-serif;
  font-size:0.7rem;padding:0.28rem;cursor:pointer;
  color:var(--muted);transition:all 0.15s;
}
.his .period-sw button.active{background:var(--his);color:#fff;border-color:var(--his);}
.her .period-sw button.active{background:var(--her);color:#fff;border-color:var(--her);}

/* ratio bar */
.ratio-row{
  padding:0.8rem 1.1rem;
  border-top:1px solid var(--border);
}
.ratio-labels{
  display:flex;justify-content:space-between;
  font-family:'DM Mono',monospace;
  font-size:0.72rem;margin-bottom:0.4rem;
}
.ratio-labels .h{color:var(--his);}
.ratio-labels .r{color:var(--her);}
.ratio-bar{height:10px;border-radius:999px;overflow:hidden;display:flex;background:var(--border);}
.ratio-bar .hs{background:var(--his);height:100%;transition:width 0.4s cubic-bezier(0.4,0,0.2,1);}
.ratio-bar .rs{background:var(--her);height:100%;flex:1;}

/* ── AID CARD ── */
.aid-section{
  padding:0.8rem 1rem;
  display:flex;flex-direction:column;gap:0.5rem;
}
.aid-row{
  display:flex;align-items:center;gap:0.5rem;
}
.aid-name{
  background:none;border:none;outline:none;
  font-family:'Noto Sans JP',sans-serif;
  font-size:0.82rem;color:var(--ink);
  border-bottom:1px dashed transparent;
  transition:border-color 0.2s;padding:0.1rem 0;
  flex:1;min-width:0;
}
.aid-name:focus{border-color:var(--aid);}
.aid-amt-w{
  display:flex;align-items:center;
  background:var(--bg);border:1px solid var(--border);
  border-radius:6px;overflow:hidden;
}
.aid-amt-w input{
  background:none;border:none;outline:none;
  font-family:'DM Mono',monospace;
  font-size:0.82rem;color:var(--ink);
  padding:0.35rem 0.4rem;width:82px;text-align:right;
}
.aid-amt-w span{padding-right:0.4rem;color:var(--muted);font-size:0.68rem;white-space:nowrap;}
.aid-del{
  background:none;border:none;color:var(--border);
  cursor:pointer;font-size:0.85rem;padding:0 0.2rem;
  transition:color 0.15s;line-height:1;
}
.aid-del:hover{color:#c0392b;}
.add-aid-btn{
  background:none;
  border:1px dashed var(--border);
  border-radius:8px;
  color:var(--muted);
  font-family:'Noto Sans JP',sans-serif;
  font-size:0.75rem;padding:0.45rem;
  cursor:pointer;transition:all 0.2s;
}
.add-aid-btn:hover{border-color:var(--aid);color:var(--aid);}
.aid-total{
  font-family:'DM Mono',monospace;
  font-size:0.72rem;color:var(--aid);
  text-align:right;padding:0.2rem 0;
}

/* ── EXPENSES ── */
.exp-list{padding:0.5rem 0.8rem;}
.exp-item{
  display:flex;flex-direction:column;gap:0.3rem;
  padding:0.6rem 0;
  border-bottom:1px solid var(--border);
}
.exp-item:last-child{border-bottom:none;}

.exp-row-top{
  display:grid;
  grid-template-columns:1fr auto auto;
  align-items:center;gap:0.5rem;
}

.exp-row-bottom{
  display:flex;align-items:center;gap:0.4rem;
}

.exp-name{
  background:none;border:none;outline:none;
  font-family:'Noto Sans JP',sans-serif;
  font-size:0.83rem;color:var(--ink);width:100%;
  border-bottom:1px dashed transparent;
  transition:border-color 0.2s;padding:0.1rem 0;
}
.exp-name:focus{border-color:var(--accent);}

.exp-amt-w{
  display:flex;align-items:center;
  background:var(--bg);border:1px solid var(--border);
  border-radius:6px;overflow:hidden;
}
.exp-amt-w input{
  background:none;border:none;outline:none;
  font-family:'DM Mono',monospace;
  font-size:0.82rem;color:var(--ink);
  padding:0.35rem 0.4rem;width:82px;text-align:right;
}
.exp-amt-w span{padding-right:0.4rem;color:var(--muted);font-size:0.68rem;white-space:nowrap;}

.del-btn{
  background:none;border:none;color:var(--border);
  cursor:pointer;font-size:0.85rem;padding:0 0.2rem;
  transition:color 0.15s;line-height:1;
}
.del-btn:hover{color:#c0392b;}

/* payment source toggle */
.pay-src-label{
  font-size:0.62rem;color:var(--muted);white-space:nowrap;
}
.pay-src-tog{
  display:flex;border:1px solid var(--border);
  border-radius:6px;overflow:hidden;
}
.pay-src-tog button{
  border:none;background:none;
  font-size:0.62rem;padding:0.22rem 0.5rem;
  cursor:pointer;color:var(--muted);
  transition:all 0.15s;white-space:nowrap;
}
.pay-src-tog button.common-active{background:var(--muted);color:#fff;}
.pay-src-tog button.his-active{background:var(--his);color:#fff;}
.pay-src-tog button.her-active{background:var(--her);color:#fff;}

.add-exp-btn{
  width:100%;background:none;
  border:1.5px dashed var(--border);
  border-radius:10px;
  color:var(--muted);
  font-family:'Noto Sans JP',sans-serif;
  font-size:0.8rem;padding:0.65rem;
  cursor:pointer;transition:all 0.2s;margin:0.5rem 0;
}
.add-exp-btn:hover{border-color:var(--accent);color:var(--accent);}

/* ── RESULT ── */
.result-grid{display:grid;grid-template-columns:1fr 1fr;}
.result-person{padding:1rem 1.1rem;}
.result-person:first-child{border-right:1px solid var(--border);}
.res-name{font-family:'Syne',sans-serif;font-size:0.82rem;font-weight:600;margin-bottom:0.2rem;}
.his .res-name{color:var(--his);}
.her .res-name{color:var(--her);}
.res-amt{font-family:'DM Mono',monospace;font-size:1.35rem;font-weight:500;color:var(--ink);margin-bottom:0.1rem;}
.res-sub{font-family:'DM Mono',monospace;font-size:0.68rem;color:var(--muted);}
.res-detail{font-family:'DM Mono',monospace;font-size:0.62rem;color:var(--muted);margin-top:0.3rem;line-height:1.6;}

.total-row{
  padding:0.7rem 1.1rem;
  border-top:1px solid var(--border);
  display:flex;justify-content:space-between;align-items:center;
}
.total-label{font-size:0.78rem;color:var(--muted);}
.total-val{font-family:'DM Mono',monospace;font-size:0.95rem;font-weight:500;}
.total-sub{font-family:'DM Mono',monospace;font-size:0.68rem;color:var(--aid);}

/* settlement box */
.settle-box{
  border-top:2px solid var(--accent);
  background:rgba(201,124,42,0.05);
  padding:1rem 1.1rem;
}
.settle-title{
  font-size:0.7rem;font-weight:500;color:var(--accent);
  margin-bottom:0.6rem;letter-spacing:0.05em;
}
.settle-item{
  display:flex;justify-content:space-between;align-items:center;
  padding:0.35rem 0;
  font-size:0.82rem;
}
.settle-arrow{
  color:var(--accent);font-weight:500;
}
.settle-amount{
  font-family:'DM Mono',monospace;
  font-weight:600;font-size:0.95rem;
  color:var(--accent);
}
.settle-none{
  text-align:center;
  color:var(--muted);font-size:0.8rem;
  padding:0.2rem 0;
}

/* save btn */
.save-btn{
  width:100%;
  background:var(--his);color:#fff;
  border:none;border-radius:var(--radius);
  font-family:'Noto Sans JP',sans-serif;
  font-size:0.9rem;font-weight:500;
  padding:0.9rem;cursor:pointer;
  transition:all 0.2s;margin-bottom:1rem;
}
.save-btn:active{transform:scale(0.98);opacity:0.9;}

/* toast */
.toast{
  position:fixed;bottom:calc(1.5rem + var(--safe-bottom));
  left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--ink);color:#fff;
  font-size:0.8rem;padding:0.6rem 1.2rem;
  border-radius:999px;
  opacity:0;transition:all 0.3s;pointer-events:none;
  white-space:nowrap;z-index:200;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* ── HISTORY PAGE ── */
.history-empty{
  text-align:center;padding:3rem 1rem;
  color:var(--muted);font-size:0.85rem;line-height:2;
}

.month-card{
  background:var(--paper);
  border:1.5px solid var(--border);
  border-radius:var(--radius);
  margin-bottom:0.8rem;
  overflow:hidden;
}
.month-head{
  padding:0.75rem 1rem;
  display:flex;justify-content:space-between;align-items:center;
  cursor:pointer;
  border-bottom:1px solid transparent;
  transition:border-color 0.2s;
}
.month-head.open{border-bottom-color:var(--border);}
.month-label{
  font-family:'DM Mono',monospace;
  font-size:0.78rem;color:var(--his);
}
.month-total{
  font-family:'DM Mono',monospace;
  font-size:0.85rem;color:var(--ink);
}
.month-detail{display:none;padding:0.7rem 1rem;}
.month-detail.open{display:block;}
.month-detail-row{
  display:flex;justify-content:space-between;
  font-size:0.78rem;padding:0.2rem 0;
  border-bottom:1px solid var(--border);
}
.month-detail-row:last-child{border:none;}
.month-settle{
  font-size:0.75rem;padding:0.5rem 0 0.2rem;
  color:var(--accent);font-weight:500;
  border-top:1px dashed var(--accent);
  margin-top:0.3rem;
}
.month-del{
  background:none;border:none;color:var(--muted);
  font-size:0.7rem;cursor:pointer;
  padding:0 0.3rem;transition:color 0.15s;
}
.month-del:hover{color:#c0392b;}

/* ── CHART PAGE ── */
.chart-wrap{
  background:var(--paper);
  border:1.5px solid var(--border);
  border-radius:var(--radius);
  padding:1rem;
  margin-bottom:1rem;
}
.chart-title{
  font-family:'DM Mono',monospace;
  font-size:0.68rem;letter-spacing:0.1em;text-transform:uppercase;
  color:var(--muted);margin-bottom:0.8rem;
}
canvas{max-height:240px;}

@media(max-width:420px){
  .income-grid{grid-template-columns:1fr;}
  .exp-row-top{grid-template-columns:1fr auto auto;}
}
</style>
</head>
<body>

<nav class="nav">
  <div class="nav-inner">
    <div class="nav-title">割り勘<span>計算</span></div>
    <div class="tab-bar">
      <button class="tab-btn active" onclick="showPage('calc')">計算</button>
      <button class="tab-btn" onclick="showPage('history')">履歴</button>
      <button class="tab-btn" onclick="showPage('chart')">グラフ</button>
    </div>
  </div>
</nav>

<div class="content">

<!-- ===== CALC PAGE ===== -->
<div class="page active" id="page-calc">
<div class="inner">

  <!-- Income -->
  <div class="card">
    <div class="card-header">収入入力</div>
    <div class="income-grid">
      <div class="person-block his">
        <div class="person-label">👨 あなた</div>
        <input class="name-input" id="hisName" type="text" value="自分" placeholder="名前" oninput="calc()">
        <div class="amt-row">
          <input type="number" id="hisIncome" placeholder="0" min="0" oninput="calc()">
          <span class="unit">万円</span>
        </div>
        <div class="period-sw">
          <button id="hisYear" class="active" onclick="setPeriod('his','year')">年収</button>
          <button id="hisMonth" onclick="setPeriod('his','month')">月収</button>
        </div>
      </div>
      <div class="person-block her">
        <div class="person-label">👩 パートナー</div>
        <input class="name-input" id="herName" type="text" value="妻" placeholder="名前" oninput="calc()">
        <div class="amt-row">
          <input type="number" id="herIncome" placeholder="0" min="0" oninput="calc()">
          <span class="unit">万円</span>
        </div>
        <div class="period-sw">
          <button id="herYear" class="active" onclick="setPeriod('her','year')">年収</button>
          <button id="herMonth" onclick="setPeriod('her','month')">月収</button>
        </div>
      </div>
    </div>
    <div class="ratio-row">
      <div class="ratio-labels">
        <span class="h" id="hisBarPct">—%</span>
        <span style="color:var(--muted);font-size:0.65rem;">収入比</span>
        <span class="r" id="herBarPct">—%</span>
      </div>
      <div class="ratio-bar">
        <div class="hs" id="hisBarSeg" style="width:50%"></div>
        <div class="rs"></div>
      </div>
    </div>
  </div>

  <!-- Aid / Support -->
  <div class="card">
    <div class="card-header">
      <span>🎁 援助・補助</span>
      <span style="font-size:0.58rem;color:var(--aid)">合計から差引</span>
    </div>
    <div class="aid-section" id="aidSection"></div>
    <div style="padding:0 1rem 0.8rem">
      <button class="add-aid-btn" onclick="addAid()">＋ 援助を追加</button>
    </div>
  </div>

  <!-- Expenses -->
  <div class="card">
    <div class="card-header">
      <span>費目リスト</span>
      <span style="font-size:0.58rem;color:var(--muted)">金額は円単位</span>
    </div>
    <div class="exp-list" id="expList"></div>
    <div style="padding:0 0.8rem 0.8rem">
      <button class="add-exp-btn" onclick="addExp()">＋ 費目を追加</button>
    </div>
  </div>

  <!-- Result -->
  <div class="card" id="resultCard">
    <div class="card-header">月額 負担まとめ</div>
    <div class="result-grid">
      <div class="result-person his">
        <div class="res-name" id="resHisName">自分</div>
        <div class="res-amt" id="resHisAmt">¥0</div>
        <div class="res-sub" id="resHisSub">—</div>
        <div class="res-detail" id="resHisDetail"></div>
      </div>
      <div class="result-person her">
        <div class="res-name" id="resHerName">妻</div>
        <div class="res-amt" id="resHerAmt">¥0</div>
        <div class="res-sub" id="resHerSub">—</div>
        <div class="res-detail" id="resHerDetail"></div>
      </div>
    </div>
    <div class="total-row">
      <span class="total-label">支出合計</span>
      <span class="total-val" id="resTotalAmt">¥0</span>
    </div>
    <div class="total-row" id="aidTotalRow" style="display:none;border-top:none;padding-top:0;">
      <span class="total-label">援助差引後</span>
      <span class="total-val total-sub" id="resNetAmt">¥0</span>
    </div>
    <div class="settle-box" id="settleBox">
      <div class="settle-title">💰 精算</div>
      <div id="settleContent"></div>
    </div>
  </div>

  <button class="save-btn" onclick="saveRecord()">📅 今月の記録を保存</button>

</div>
</div>

<!-- ===== HISTORY PAGE ===== -->
<div class="page" id="page-history">
<div class="inner">
  <div id="historyList"></div>
</div>
</div>

<!-- ===== CHART PAGE ===== -->
<div class="page" id="page-chart">
<div class="inner">
  <div class="chart-wrap">
    <div class="chart-title">月別 合計生活費</div>
    <canvas id="chartTotal"></canvas>
  </div>
  <div class="chart-wrap">
    <div class="chart-title">月別 負担割合</div>
    <canvas id="chartRatio"></canvas>
  </div>
  <div class="chart-wrap">
    <div class="chart-title">今月の費目内訳</div>
    <canvas id="chartDoughnut"></canvas>
  </div>
</div>
</div>

</div><!-- /content -->

<div class="toast" id="toast"></div>

<script>
// ─── STATE ───────────────────────────────────────────────
let periods = { his:'year', her:'year' };
const DEFAULT_EXPS = [
  {name:'家賃', amount:0, paidBy:'common'},
  {name:'生活費（共通口座）', amount:0, paidBy:'common'},
  {name:'食費（個人立替）', amount:0, paidBy:'common'},
];
const DEFAULT_AIDS = [
  {name:'母からの援助', amount:50000},
];
let exps = [];
let aids = [];
let records = [];
let charts = {};

// ─── STORAGE ─────────────────────────────────────────────
function save() {
  localStorage.setItem('warikin_state', JSON.stringify({
    hisName: v('hisName'), herName: v('herName'),
    hisIncome: v('hisIncome'), herIncome: v('herIncome'),
    hisPeriod: periods.his, herPeriod: periods.her,
    exps, aids
  }));
  localStorage.setItem('warikin_records', JSON.stringify(records));
}

function load() {
  const s = JSON.parse(localStorage.getItem('warikin_state') || 'null');
  records = JSON.parse(localStorage.getItem('warikin_records') || '[]');
  if (s) {
    document.getElementById('hisName').value = s.hisName || '自分';
    document.getElementById('herName').value = s.herName || '妻';
    document.getElementById('hisIncome').value = s.hisIncome || '';
    document.getElementById('herIncome').value = s.herIncome || '';
    periods.his = s.hisPeriod || 'year';
    periods.her = s.herPeriod || 'year';
    ['his','her'].forEach(p => {
      document.getElementById(p+'Year').classList.toggle('active', periods[p]==='year');
      document.getElementById(p+'Month').classList.toggle('active', periods[p]==='month');
    });
    exps = s.exps || JSON.parse(JSON.stringify(DEFAULT_EXPS));
    aids = s.aids || JSON.parse(JSON.stringify(DEFAULT_AIDS));
    exps.forEach(e => { if(!e.paidBy) e.paidBy = 'common'; });
  } else {
    exps = JSON.parse(JSON.stringify(DEFAULT_EXPS));
    aids = JSON.parse(JSON.stringify(DEFAULT_AIDS));
  }
}

// ─── HELPERS ─────────────────────────────────────────────
function v(id){ return document.getElementById(id).value; }
function getMonthly(p){
  const val = parseFloat(document.getElementById(p+'Income').value) || 0;
  return periods[p]==='year' ? val/12 : val;
}
function getNames(){ return { his: v('hisName')||'自分', her: v('herName')||'パートナー' }; }

function getRatios(){
  const hm = getMonthly('his'), herm = getMonthly('her');
  const total = hm + herm;
  return total > 0 ? { hisR: hm/total, herR: herm/total, total } : { hisR:0.5, herR:0.5, total:0 };
}

function yen(n){ return '¥' + Math.round(n).toLocaleString(); }

function getTotalAid(){
  let sum = 0;
  aids.forEach(a => { sum += parseInt(a.amount) || 0; });
  return sum;
}

// ─── PERIOD TOGGLE ────────────────────────────────────────
function setPeriod(p, mode){
  periods[p] = mode;
  document.getElementById(p+'Year').classList.toggle('active', mode==='year');
  document.getElementById(p+'Month').classList.toggle('active', mode==='month');
  calc(); save();
}

// ─── AID RENDER ──────────────────────────────────────────
function renderAids(){
  const sec = document.getElementById('aidSection');
  sec.innerHTML = '';
  aids.forEach((a,i) => {
    const row = document.createElement('div');
    row.className = 'aid-row';
    row.innerHTML = `
      <input class="aid-name" type="text" value="${a.name}" placeholder="援助元"
        oninput="aids[${i}].name=this.value;save()">
      <div class="aid-amt-w">
        <input type="number" min="0" step="1" value="${a.amount||''}" placeholder="0"
          oninput="aids[${i}].amount=parseInt(this.value)||0;calc();save()">
        <span>円</span>
      </div>
      <button class="aid-del" onclick="delAid(${i})">✕</button>
    `;
    sec.appendChild(row);
  });
  // total display
  const tot = getTotalAid();
  if(tot > 0){
    const t = document.createElement('div');
    t.className = 'aid-total';
    t.textContent = '援助合計: ' + yen(tot);
    sec.appendChild(t);
  }
}
function addAid(){
  aids.push({name:'新しい援助', amount:0});
  renderAids(); save();
}
function delAid(i){
  aids.splice(i,1);
  renderAids(); calc(); save();
}

// ─── CALC ─────────────────────────────────────────────────
function calc(){
  const {hisR, herR, total} = getRatios();
  const hisPct = Math.round(hisR*100);
  const herPct = 100 - hisPct;
  const hasIncome = total > 0;

  document.getElementById('hisBarPct').textContent = hasIncome ? hisPct+'%' : '—%';
  document.getElementById('herBarPct').textContent = hasIncome ? herPct+'%' : '—%';
  document.getElementById('hisBarSeg').style.width = (hasIncome ? hisPct : 50) + '%';

  renderExps();
  renderAids();

  // ── 全費目の合計
  let grand = 0;
  let paidByCommon = 0;
  let paidByHis = 0;
  let paidByHer = 0;

  exps.forEach(e => {
    const a = parseInt(e.amount) || 0;
    grand += a;
    if(e.paidBy === 'common') paidByCommon += a;
    else if(e.paidBy === 'his') paidByHis += a;
    else if(e.paidBy === 'her') paidByHer += a;
  });

  // ── 援助を差し引き
  const aidTotal = getTotalAid();
  const netTotal = Math.max(0, grand - aidTotal);  // 二人で負担する額

  // ── 年収比で負担額を算出（援助差引後）
  const hisBurden = Math.round(netTotal * hisR);
  const herBurden = netTotal - hisBurden;

  const n = getNames();
  document.getElementById('resHisName').textContent = n.his;
  document.getElementById('resHerName').textContent = n.her;
  document.getElementById('resHisAmt').textContent = yen(hisBurden);
  document.getElementById('resHerAmt').textContent = yen(herBurden);
  document.getElementById('resHisSub').textContent = netTotal>0 ? `負担率 ${(hisBurden/netTotal*100).toFixed(1)}%` : '—';
  document.getElementById('resHerSub').textContent = netTotal>0 ? `負担率 ${(herBurden/netTotal*100).toFixed(1)}%` : '—';

  // 内訳詳細
  let hisDetailHtml = '';
  let herDetailHtml = '';
  if(paidByHis > 0) hisDetailHtml += `個人支払: ${yen(paidByHis)}<br>`;
  if(paidByHer > 0) herDetailHtml += `個人支払: ${yen(paidByHer)}<br>`;

  const hisShareOfCommon = hisBurden - paidByHis;
  const herShareOfCommon = herBurden - paidByHer;
  if(grand > 0){
    hisDetailHtml += `共通口座分: ${yen(Math.max(0, hisShareOfCommon))}`;
    herDetailHtml += `共通口座分: ${yen(Math.max(0, herShareOfCommon))}`;
  }
  document.getElementById('resHisDetail').innerHTML = hisDetailHtml;
  document.getElementById('resHerDetail').innerHTML = herDetailHtml;

  document.getElementById('resTotalAmt').textContent = yen(grand);

  // 援助表示
  const aidRow = document.getElementById('aidTotalRow');
  if(aidTotal > 0){
    aidRow.style.display = 'flex';
    document.getElementById('resNetAmt').textContent = yen(netTotal) + '（援助 -' + yen(aidTotal) + '）';
  } else {
    aidRow.style.display = 'none';
  }

  // ── 精算計算
  // 各費目について、自分が立替た中の相手負担分と、相手が立替た中の自分負担分を計算
  // 注意: 負担比率は援助差引後の netTotal に対してではなく、
  //        「各費目の金額 × 比率」ではなく、
  //        全体の負担額ベースで考える。
  //
  // シンプルなアプローチ:
  //   自分の負担すべき額 = hisBurden
  //   自分が実際に支払った額 = paidByHis + (共通口座からの自分の拠出分)
  //   共通口座の支出 = paidByCommon + aidTotal (援助は共通口座に入る)
  //   共通口座の収入 = 自分の拠出 + 相手の拠出 + 援助
  //   共通口座の支出 = paidByCommon
  //   なので: 自分の共通口座拠出すべき額 = hisBurden - paidByHis
  //   もし < 0 → 自分が払いすぎ → 共通口座から返してもらう
  //
  //   ただし共通口座には援助 aidTotal 円も入っているので
  //   共通口座に二人が入れるべき額 = paidByCommon - aidTotal
  //   自分が共通口座に入れるべき額 = (paidByCommon - aidTotal) のうち自分比率分
  //   → いや、もっとシンプルに考える:
  //
  //   負担すべき額: hisBurden (= netTotal × hisR)
  //   個人で払った額: paidByHis
  //   差額 = hisBurden - paidByHis
  //     正 → 共通口座からその分負担している（追加支払い不要）
  //     負 → 個人で負担すべき額以上に払っている → 共通口座から返金

  const settleContent = document.getElementById('settleContent');

  if(grand === 0){
    settleContent.innerHTML = '<div class="settle-none">費目を入力してください</div>';
    return;
  }

  let lines = [];

  // 自分の過不足: hisBurden - paidByHis = 共通口座で負担すべき額
  // 相手の過不足: herBurden - paidByHer = 共通口座で負担すべき額
  // 共通口座の収支: paidByCommon(支出) vs (aidTotal + 二人の拠出)(収入)
  //
  // 精算の考え方:
  // 自分が個人で hisBurden より多く払った場合 → 共通口座(or相手)から返してもらう
  // 自分が個人で hisBurden より少なく払った場合 → 残りは共通口座から出ている（OK）

  if(hisShareOfCommon < 0){
    // 自分が個人で負担額以上に払っている → 共通口座から返金
    lines.push({
      label: `共通口座 → ${n.his}`,
      amount: Math.abs(hisShareOfCommon),
      note: '個人支払の超過分'
    });
  }
  if(herShareOfCommon < 0){
    lines.push({
      label: `共通口座 → ${n.her}`,
      amount: Math.abs(herShareOfCommon),
      note: '個人支払の超過分'
    });
  }

  // 共通口座の実際の支出と、二人が共通口座に入れるべき額の関係
  const hisToCommon = Math.max(0, hisShareOfCommon);
  const herToCommon = Math.max(0, herShareOfCommon);
  const neededInCommon = paidByCommon; // 共通口座から出た額
  const fundedByAid = aidTotal;       // 援助で賄われる分
  const neededFromCouple = neededInCommon - fundedByAid; // 二人で入れるべき額

  // 二人が共通口座に入れるべき額
  if(neededFromCouple > 0){
    const hisContrib = Math.round(neededFromCouple * hisR);
    const herContrib = neededFromCouple - hisContrib;

    // もし hisToCommon や herToCommon と一致しない場合は調整が必要だが、
    // 基本的に一致するはず（援助が共通口座に入る前提）
  }

  if(lines.length === 0 && paidByHis === 0 && paidByHer === 0){
    settleContent.innerHTML = '<div class="settle-none">全て共通口座から支払済み</div>';
  } else if(lines.length === 0){
    settleContent.innerHTML = '<div class="settle-none">精算不要</div>';
  } else {
    settleContent.innerHTML = lines.map(l =>
      `<div class="settle-item">
        <span class="settle-arrow">${l.label}</span>
        <span class="settle-amount">${yen(l.amount)}</span>
      </div>`
    ).join('');
  }
}

// ─── RENDER EXPS ─────────────────────────────────────────
function renderExps(){
  const list = document.getElementById('expList');
  const n = getNames();
  list.innerHTML = '';
  exps.forEach((e,i) => {
    const paidBy = e.paidBy || 'common';
    const row = document.createElement('div');
    row.className = 'exp-item';
    row.innerHTML = `
      <div class="exp-row-top">
        <input class="exp-name" type="text" value="${e.name}" placeholder="費目名"
          oninput="exps[${i}].name=this.value;save()">
        <div class="exp-amt-w">
          <input type="number" min="0" step="1" value="${e.amount||''}" placeholder="0"
            oninput="exps[${i}].amount=parseInt(this.value)||0;calc();save()">
          <span>円</span>
        </div>
        <button class="del-btn" onclick="delExp(${i})">✕</button>
      </div>
      <div class="exp-row-bottom">
        <span class="pay-src-label">支払元:</span>
        <div class="pay-src-tog">
          <button class="${paidBy==='common'?'common-active':''}" onclick="setPaidBy(${i},'common')">共通口座</button>
          <button class="${paidBy==='his'?'his-active':''}" onclick="setPaidBy(${i},'his')">${n.his}</button>
          <button class="${paidBy==='her'?'her-active':''}" onclick="setPaidBy(${i},'her')">${n.her}</button>
        </div>
      </div>
    `;
    list.appendChild(row);
  });
}

function setPaidBy(i, who){ exps[i].paidBy=who; calc(); save(); }
function addExp(){
  exps.push({name:'新しい費目',amount:0,paidBy:'common'});
  calc(); save();
  setTimeout(()=>{
    const inputs=document.querySelectorAll('.exp-name');
    if(inputs.length) inputs[inputs.length-1].focus();
  },50);
}
function delExp(i){ exps.splice(i,1); calc(); save(); }

// ─── SAVE RECORD ─────────────────────────────────────────
function saveRecord(){
  const {hisR, herR} = getRatios();
  let grand = 0;
  exps.forEach(e=>{ grand += parseInt(e.amount)||0; });
  if(grand===0){ toast('費目の金額を入力してください'); return; }

  const aidTotal = getTotalAid();
  const netTotal = Math.max(0, grand - aidTotal);
  const hisBurden = Math.round(netTotal * hisR);
  const herBurden = netTotal - hisBurden;

  const now = new Date();
  const label = `${now.getFullYear()}年${now.getMonth()+1}月`;
  const n = getNames();
  const rec = {
    label, date: now.toISOString(),
    hisName: n.his, herName: n.her,
    hisAmt: hisBurden,
    herAmt: herBurden,
    total: grand,
    aidTotal,
    netTotal,
    hisR: parseFloat(hisR.toFixed(4)),
    exps: exps.map(e=>({...e})),
    aids: aids.map(a=>({...a}))
  };
  records.unshift(rec);
  save();
  toast(`${label}を保存しました ✓`);
  renderHistory();
}

// ─── TOAST ───────────────────────────────────────────────
function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'),2200);
}

// ─── HISTORY ─────────────────────────────────────────────
function renderHistory(){
  const el = document.getElementById('historyList');
  if(!records.length){
    el.innerHTML = `<div class="history-empty">まだ記録がありません<br>計算ページで「今月の記録を保存」を押してください</div>`;
    return;
  }
  el.innerHTML = '';
  records.forEach((r,i)=>{
    const mc = document.createElement('div');
    mc.className = 'month-card';
    const hisPct = Math.round(r.hisR*100);
    const isYen = r.total > 1000;
    const fmtAmt = (v) => isYen ? yen(v) : v+'万円';

    // settle info
    let settleHtml = '';
    if(r.exps){
      let paidByHis=0, paidByHer=0;
      r.exps.forEach(e=>{
        const a = parseInt(e.amount)||0;
        if(e.paidBy==='his') paidByHis+=a;
        if(e.paidBy==='her') paidByHer+=a;
      });
      const hisShare = r.hisAmt - paidByHis;
      const herShare = r.herAmt - paidByHer;
      if(hisShare < 0) settleHtml += `<div class="month-settle">共通口座 → ${r.hisName} ${fmtAmt(Math.abs(hisShare))}</div>`;
      if(herShare < 0) settleHtml += `<div class="month-settle">共通口座 → ${r.herName} ${fmtAmt(Math.abs(herShare))}</div>`;
    }

    // aid info
    let aidHtml = '';
    if(r.aidTotal > 0){
      aidHtml = `<div class="month-detail-row" style="color:var(--aid)"><span>援助合計</span><span style="font-family:'DM Mono',monospace">-${fmtAmt(r.aidTotal)}</span></div>`;
    }

    mc.innerHTML = `
      <div class="month-head" onclick="toggleDetail(this)">
        <span class="month-label">${r.label}</span>
        <span style="display:flex;align-items:center;gap:0.7rem">
          <span style="font-size:0.7rem;color:var(--muted)">${r.hisName} ${hisPct}% / ${r.herName} ${100-hisPct}%</span>
          <span class="month-total">${fmtAmt(r.total)}</span>
          <button class="month-del" onclick="event.stopPropagation();delRecord(${i})">削除</button>
        </span>
      </div>
      <div class="month-detail">
        <div class="month-detail-row"><span>${r.hisName}の負担</span><span style="color:var(--his);font-family:'DM Mono',monospace">${fmtAmt(r.hisAmt)}</span></div>
        <div class="month-detail-row"><span>${r.herName}の負担</span><span style="color:var(--her);font-family:'DM Mono',monospace">${fmtAmt(r.herAmt)}</span></div>
        ${(r.exps||[]).map(e=>{
          const paidLabel = e.paidBy==='his' ? ` [${r.hisName}]` : (e.paidBy==='her' ? ` [${r.herName}]` : ' [共通]');
          const amt = isYen ? yen(e.amount||0) : (e.amount||0)+'万';
          return `
          <div class="month-detail-row">
            <span>${e.name}${paidLabel}</span>
            <span style="font-family:'DM Mono',monospace;color:var(--muted)">${amt}</span>
          </div>`;
        }).join('')}
        ${aidHtml}
        ${settleHtml}
      </div>
    `;
    el.appendChild(mc);
  });
}

function toggleDetail(head){
  head.classList.toggle('open');
  head.nextElementSibling.classList.toggle('open');
}

function delRecord(i){
  if(!confirm('この記録を削除しますか？')) return;
  records.splice(i,1);
  save();
  renderHistory();
  renderCharts();
}

// ─── CHARTS ──────────────────────────────────────────────
function renderCharts(){
  Object.values(charts).forEach(c=>c.destroy());
  charts = {};

  if(!records.length){
    ['chartTotal','chartRatio','chartDoughnut'].forEach(id=>{
      const ctx = document.getElementById(id).getContext('2d');
      ctx.clearRect(0,0,9999,9999);
    });
    return;
  }

  const rev = [...records].reverse();
  const labels = rev.map(r=>r.label.replace('年','年\n'));
  const totals = rev.map(r=>r.total);
  const hisAmts = rev.map(r=>r.hisAmt);
  const herAmts = rev.map(r=>r.herAmt);

  charts.total = new Chart(document.getElementById('chartTotal').getContext('2d'),{
    type:'bar',
    data:{
      labels,
      datasets:[{
        label:'合計生活費',
        data:totals,
        backgroundColor:'rgba(44,95,138,0.25)',
        borderColor:'#2c5f8a',
        borderWidth:2,
        borderRadius:6,
      }]
    },
    options:{
      responsive:true,maintainAspectRatio:true,
      plugins:{legend:{display:false}},
      scales:{
        y:{beginAtZero:true,ticks:{font:{size:10},callback:v=>v>=10000?(v/10000)+'万':v.toLocaleString()}},
        x:{ticks:{font:{size:10}}}
      }
    }
  });

  const hisName = records[0]?.hisName||'自分';
  const herName = records[0]?.herName||'パートナー';
  charts.ratio = new Chart(document.getElementById('chartRatio').getContext('2d'),{
    type:'bar',
    data:{
      labels,
      datasets:[
        {label:hisName, data:hisAmts, backgroundColor:'rgba(44,95,138,0.75)', borderRadius:4},
        {label:herName, data:herAmts, backgroundColor:'rgba(138,63,95,0.75)', borderRadius:4},
      ]
    },
    options:{
      responsive:true,maintainAspectRatio:true,
      plugins:{legend:{labels:{font:{size:11}}}},
      scales:{
        y:{beginAtZero:true,stacked:true,ticks:{font:{size:10},callback:v=>v>=10000?(v/10000)+'万':v.toLocaleString()}},
        x:{stacked:true,ticks:{font:{size:10}}}
      }
    }
  });

  const latest = records[0];
  const dLabels = (latest.exps||[]).filter(e=>(parseInt(e.amount)||0)>0).map(e=>e.name);
  const dData = (latest.exps||[]).filter(e=>(parseInt(e.amount)||0)>0).map(e=>parseInt(e.amount));
  const dColors = ['#2c5f8a','#8a3f5f','#c97c2a','#2a8a5f','#5f8a2c','#6a3f8a','#8a6a2c'];

  charts.doughnut = new Chart(document.getElementById('chartDoughnut').getContext('2d'),{
    type:'doughnut',
    data:{
      labels:dLabels,
      datasets:[{data:dData, backgroundColor:dColors.slice(0,dLabels.length), borderWidth:2, borderColor:'#fffdf9'}]
    },
    options:{
      responsive:true,maintainAspectRatio:true,
      plugins:{legend:{position:'bottom',labels:{font:{size:10},padding:12}}}
    }
  });
}

// ─── PAGE SWITCH ─────────────────────────────────────────
function showPage(name){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('page-'+name).classList.add('active');
  event.currentTarget.classList.add('active');
  if(name==='history') renderHistory();
  if(name==='chart') renderCharts();
}

// ─── PWA SW ──────────────────────────────────────────────
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('./sw.js').catch(()=>{});
  });
}

// ─── INIT ─────────────────────────────────────────────────
load();
calc();
</script>
